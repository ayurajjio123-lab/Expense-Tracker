workflows:
  android-debug:
    name: Daily Expense Tracker Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: v22.11.0
      vars:
        PACKAGE_NAME: "com.example.dailyexpensetracker"
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/expense_tracker_mobile"
          npm ci
      - name: Generate Android project with Expo
        script: |
          cd "$CM_BUILD_DIR/expense_tracker_mobile"
          npx expo prebuild --platform android --non-interactive
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/expense_tracker_mobile/android/local.properties"
      - name: Build Android APK
        script: |
          cd "$CM_BUILD_DIR/expense_tracker_mobile/android"
          ./gradlew assembleRelease
    artifacts:
      - expense_tracker_mobile/android/app/build/outputs/**/*.apk
