workflows:
  android-release:
    name: Daily Expense Tracker Android
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      node: 22.11.0
      vars:
        PACKAGE_NAME: "com.example.dailyexpensetracker"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Validate Expo configuration
        script: npx expo config --type public
      - name: Generate Android project
        script: npx expo prebuild --platform android --non-interactive
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
